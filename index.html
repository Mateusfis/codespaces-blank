<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Formulário de cadastro de estudantes da Universidade Horizonte."
    />
    <title>Cadastro universitário | Universidade Horizonte</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #302b36;
        background: #f5f3f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 10% 10%, #eadff1 0, transparent 38%),
          #f5f3f8;
      }

      .page {
        width: min(100%, 560px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 22px 4px;
        color: #77486f;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        display: grid;
        width: 38px;
        height: 38px;
        place-items: center;
        border-radius: 12px;
        background: #89527f;
        color: #fff;
        font-family: Georgia, serif;
        font-size: 22px;
      }

      .card {
        position: relative;
        padding: clamp(26px, 6vw, 44px);
        border: 2px solid transparent;
        border-radius: 20px;
        background:
          linear-gradient(#fff, #fff) padding-box,
          linear-gradient(135deg, #d9c5e8 0%, #e9bfd4 28%, #a96b9d 58%, #d8b9e2 82%, #c9d5ef 100%) border-box;
        box-shadow:
          0 18px 50px rgb(59 43 66 / 9%),
          0 0 22px rgb(169 107 157 / 12%);
      }

      .card::before {
        position: absolute;
        top: 0;
        right: 12%;
        left: 12%;
        height: 3px;
        border-radius: 0 0 6px 6px;
        background: linear-gradient(90deg, #c9d5ef, #c486ad, #9472b1, #c9d5ef);
        content: "";
      }

      .eyebrow {
        margin: 0 0 10px;
        color: #89527f;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #343238;
        font-size: clamp(27px, 5vw, 34px);
        letter-spacing: -0.04em;
        line-height: 1.15;
      }

      .intro {
        margin: 12px 0 28px;
        color: #626168;
        font-size: 15px;
        line-height: 1.6;
      }

      .fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field-full {
        grid-column: 1 / -1;
      }

      label {
        color: #39383f;
        font-size: 13px;
        font-weight: 650;
      }

      input,
      select {
        width: 100%;
        min-height: 48px;
        padding: 0 14px;
        border: 1px solid #dcd6e2;
        border-radius: 9px;
        outline: none;
        background: #fff;
        color: #302b36;
        font: inherit;
        font-size: 14px;
        transition:
          border-color 150ms ease,
          box-shadow 150ms ease;
      }

      input::placeholder {
        color: #918998;
      }

      input:focus,
      select:focus {
        border-color: #a96b9d;
        box-shadow: 0 0 0 3px rgb(169 107 157 / 18%);
      }

      select:invalid {
        color: #98a5b4;
      }

      select option {
        color: #302b36;
      }

      .hint {
        margin: -2px 0 0;
        color: #77757b;
        font-size: 12px;
      }

      button {
        width: 100%;
        min-height: 50px;
        margin-top: 26px;
        border: 0;
        border-radius: 9px;
        background: linear-gradient(100deg, #89527f 0%, #a75c88 55%, #79649f 100%);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        transition:
          background-color 150ms ease,
          transform 150ms ease;
      }

      button:hover {
        background: linear-gradient(100deg, #704064 0%, #88466f 55%, #625080 100%);
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #c9a5c4;
        outline-offset: 3px;
      }

      .status {
        margin: 16px 0 0;
        color: #68445e;
        font-size: 14px;
        line-height: 1.5;
      }

      .status:empty {
        display: none;
      }

      .footer {
        margin: 18px 0 0;
        color: #68666e;
        font-size: 12px;
        text-align: center;
      }

      @media (max-width: 480px) {
        .fields {
          grid-template-columns: 1fr;
        }

        .field-full {
          grid-column: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="brand" aria-label="Universidade Horizonte">
        <span class="brand-mark" aria-hidden="true">H</span>
        <span>UNIVERSIDADE HORIZONTE</span>
      </div>

      <section class="card" aria-labelledby="form-title">
        <p class="eyebrow">Portal do estudante</p>
        <h1 id="form-title">Faça seu cadastro</h1>
        <p class="intro">
          Preencha seus dados para iniciar seu cadastro universitário.
        </p>

        <form id="registration-form">
          <div class="fields">
            <div class="field field-full">
              <label for="name">Nome completo</label>
              <input
                id="name"
                name="name"
                type="text"
                autocomplete="name"
                placeholder="Ex.: Ana Souza"
                required
              />
            </div>

            <div class="field field-full">
              <label for="email">E-mail</label>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="voce@exemplo.com"
                required
              />
            </div>

            <div class="field">
              <label for="age">Idade</label>
              <input
                id="age"
                name="age"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                placeholder="Ex.: 20"
                aria-describedby="age-hint"
                required
              />
              <p class="hint" id="age-hint">Informe sua idade em anos completos.</p>
            </div>

            <div class="field">
              <label for="education">Escolaridade</label>
              <select id="education" name="education" required>
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="medio-incompleto">Ensino médio incompleto</option>
                <option value="medio-completo">Ensino médio completo</option>
                <option value="superior-incompleto">Ensino superior incompleto</option>
                <option value="superior-completo">Ensino superior completo</option>
                <option value="pos-graduacao">Pós-graduação</option>
              </select>
            </div>
          </div>

          <button type="submit">Enviar cadastro</button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <p class="footer">Universidade Horizonte · Educação que transforma</p>
    </main>

    <script>
      const form = document.querySelector("#registration-form");
      const status = document.querySelector("#form-status");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        status.textContent =
          "Dados validados. A integração para envio do cadastro ainda não está configurada.";
      });
    </script>
  </body>
</html>
